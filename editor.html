<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Markdown — MDX</title>
  </head>
  <body class="editor-page">
    <textarea id="editor-text" spellcheck="false" aria-label="Markdown source"></textarea>
    <div class="editor-actions">
      <button class="editor-btn" id="editor-cancel" type="button" title="Cancel (Esc)">Cancel</button>
      <button class="editor-btn" id="editor-save" type="button" title="Save (Ctrl+S)">Save</button>
      <button class="about-btn" id="editor-done" type="button">Close</button>
    </div>
    <script type="module" src="/src/editor-main.ts"></script>
  </body>
</html>
