<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDX</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="app" class="app" data-sidebar="closed">
      <header class="toolbar" role="toolbar" aria-label="Main toolbar">
        <button class="tb-btn" id="btn-sidebar" title="Table of contents (Ctrl+\)" aria-label="Toggle table of contents">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9"/></svg>
        </button>
        <button class="tb-btn" id="btn-open" title="Open file (Ctrl+O)" aria-label="Open file">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l1.5 2h7A1.5 1.5 0 0 1 17.5 7.5v7A1.5 1.5 0 0 1 16 16H3.5A1.5 1.5 0 0 1 2 14.5z"/></svg>
        </button>

        <div class="tb-title" id="doc-title" title="">No document</div>

        <div class="tb-spacer"></div>

        <button class="tb-btn" id="btn-find" title="Find in document (Ctrl+F)" aria-label="Find">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        </button>
        <button class="tb-btn" id="btn-theme" title="Cycle theme (Ctrl+Shift+T)" aria-label="Theme">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"/></svg>
        </button>
        <button class="tb-btn" id="btn-print" title="Export / print (Ctrl+P)" aria-label="Print">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8V3h8v5M6 15H4v-5h12v5h-2M6 12h8v5H6z"/></svg>
        </button>
        <button class="tb-btn" id="btn-menu" title="More" aria-label="More options" aria-haspopup="menu">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="4.5" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="10" cy="15.5" r="1.4"/></svg>
        </button>
      </header>

      <div class="body">
        <nav class="sidebar" id="sidebar" aria-label="Table of contents">
          <div class="sidebar-head">
            <span>Contents</span>
            <input type="search" id="toc-filter" placeholder="Filter…" aria-label="Filter headings" />
          </div>
          <ol class="toc" id="toc"></ol>
          <div class="sidebar-foot">
            <div class="doc-stats" id="doc-stats"></div>
          </div>
        </nav>

        <main class="viewer" id="viewer" tabindex="-1">
          <div class="reading-progress" id="progress"></div>
          <article class="markdown-body" id="content" aria-live="polite"></article>
          <section class="welcome" id="welcome">
            <h1>MDX</h1>
            <p class="tagline">A fast Markdown viewer.</p>
            <p class="drop-hint">Drop a <code>.md</code> file here, or press <kbd>Ctrl</kbd>+<kbd>O</kbd>.</p>
            <ul class="recents" id="recents"></ul>
          </section>
        </main>
      </div>

      <div class="find-bar" id="find-bar" hidden>
        <input type="search" id="find-input" placeholder="Find in document" aria-label="Find in document" />
        <span class="find-count" id="find-count">0/0</span>
        <button class="tb-btn sm" id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>
        <button class="tb-btn sm" id="find-next" title="Next (Enter)" aria-label="Next match">↓</button>
        <button class="tb-btn sm" id="find-close" title="Close (Esc)" aria-label="Close find">✕</button>
      </div>

      <div class="menu" id="menu" hidden role="menu"></div>
      <div class="toast" id="toast" hidden></div>
      <div class="lightbox" id="lightbox" hidden><img id="lightbox-img" alt="" /></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
